name: ci-release-gate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  microcopy-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run microcopy lock test
        run: npm test -- tests/wis97-critical-microcopy-lock.test.ts

  test-build:
    runs-on: ubuntu-latest
    needs: microcopy-lock
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run full tests
        run: npm test

      - name: Build
        run: npm run build
